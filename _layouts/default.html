<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <link rel="icon" type="image/jpeg" href="{{ '/res/img/trollge.jpg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="brand-logo" src="{{ '/res/img/trollge.jpg' | relative_url }}" alt="trollge">
        <span class="brand-name">Giggles&amp;Shit</span>
        <span class="brand-tag">GAS</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a data-nav href="{{ '/' | relative_url }}">Home</a>
        <a data-nav href="{{ '/features/' | relative_url }}">Features</a>
        <a data-nav href="{{ '/installation/' | relative_url }}">Installation</a>
        <a data-nav href="{{ '/faq/' | relative_url }}">FAQ</a>
        <a data-nav class="nav-docs" href="{{ '/docs/' | relative_url }}">Docs&nbsp;→</a>
        <a class="nav-github" href="https://github.com/havaianasdestruido/Giggles-Shit" target="_blank" rel="noopener" aria-label="GitHub repository">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>
        <strong>Giggles&amp;Shit</strong> — custom emojis for GitHub.
        Docs powered by <a href="https://docusaurus.io/">Docusaurus</a>, site built with Jekyll.
      </p>
      <p class="footer-links">
        <a href="{{ '/docs/' | relative_url }}">Documentation</a> ·
        <a href="https://github.com/havaianasdestruido/Giggles-Shit/blob/main/LICENSE">ISC License</a> ·
        <a href="https://github.com/havaianasdestruido/Giggles-Shit/issues/new">Report an issue</a>
      </p>
      <p class="copyright">© <span id="year">2026</span> Giggles&amp;Shit contributors</p>
    </div>
  </footer>

  <script>
    // Highlight the current page in the nav; fill the footer year.
    (function () {
      var path = location.pathname.replace(/\/index\.html$/, '/');
      document.querySelectorAll('[data-nav]').forEach(function (a) {
        if (new URL(a.href, location.origin).pathname === path) {
          a.classList.add('active');
        }
      });
      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
